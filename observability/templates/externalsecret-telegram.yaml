{{- if .Values.externalSecret.enabled }}
{{- $es := .Values.externalSecret -}}
# ExternalSecret → Secret `alertmanager-telegram` trong namespace observability.
#
# Prometheus Operator mount Secret này (khai ở kube-prometheus-stack.alertmanager.alertmanagerSpec
# .secrets) vào /etc/alertmanager/secrets/alertmanager-telegram/, và Alertmanager đọc token bằng
# `bot_token_file`. Nhờ đó bot token KHÔNG BAO GIỜ nằm trong Git — quan trọng vì repo này PUBLIC.
#
# Giá trị sống ở SSM, tức NGOÀI cụm ⇒ `terraform destroy` không xoá ⇒ buổi sau dựng lại là
# Alertmanager có token ngay, không ai chạy script nào. Đúng tiêu chí vàng "0 thao tác tay".
#
# 🔴 File này chỉ chứa TÊN param, không chứa một giá trị secret nào.
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $es.targetName }}
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Secret phải có TRƯỚC pod Alertmanager. Thiếu wave này thì pod start lúc Secret chưa tồn tại
    # → CreateContainerConfigError. Nó tự khỏi sau khi ESO sync, nhưng giữa buổi demo trông hệt
    # như cụm hỏng. Cùng pattern với charts/platform/templates/externalsecret.yaml.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    # ClusterSecretStore (cluster-scoped) do scripts/bootstrap.sh của Day 3 cài — dùng chung cho
    # mọi namespace. Tên `aws-ssm` là HỢP ĐỒNG, smoke-irsa.sh của repo app hardcode đúng tên này.
    name: {{ $es.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ $es.targetName }}
    creationPolicy: Owner
  dataFrom:
    - find:
        path: {{ required "externalSecret.ssmPath là bắt buộc khi externalSecret.enabled" $es.ssmPath | quote }}
        # 🔴 `name.regexp` BẮT BUỘC, không phải bộ lọc tuỳ chọn — đã trả giá học ở Day 6.
        # Provider AWS Parameter Store của ESO chọn cách tìm theo TOÁN TỬ (find.name → theo tên,
        # find.tags → theo tag, không có gì → error "unexpected find operator"). `path` chỉ là bộ
        # LỌC PHẠM VI, tự nó không phải toán tử. Thiếu `name` thì ExternalSecret đứng
        # SecretSyncedError vĩnh viễn và message KHÔNG hề nhắc tới việc thiếu `name`.
        name:
          regexp: ".*"
      # 🔴 rewrite KHÔNG phải làm đẹp — thiếu là hỏng thẳng. ESO trả key kèm NGUYÊN đường dẫn
      # ("/badminton/observability/TELEGRAM_BOT_TOKEN"), mà key của Kubernetes Secret bắt buộc
      # khớp [-._a-zA-Z0-9]+ — dấu "/" không hợp lệ → không sync được → pod
      # CreateContainerConfigError. Regex cắt lấy đoạn sau dấu "/" cuối → TELEGRAM_BOT_TOKEN,
      # đúng cái tên mà `bot_token_file` trỏ tới.
      rewrite:
        - regexp:
            source: "^.*/([^/]+)$"
            target: "${1}"
{{- end }}
