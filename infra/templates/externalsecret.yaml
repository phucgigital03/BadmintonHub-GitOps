{{- if .Values.externalSecret.enabled }}
{{- $es := .Values.externalSecret -}}
{{- $path := required "externalSecret.ssmPath là bắt buộc khi externalSecret.enabled" $es.ssmPath -}}
# ExternalSecret → Secret `datastore-secrets` trong namespace data-<env>.
#
# Đây là Secret mà CHÍNH 3 chart Bitnami đọc để KHỞI TẠO datastore (`existingSecret` trong
# infra/values.yaml), chứ không phải để app đọc. Nhờ trỏ cùng một nguồn SSM với `app-secrets`,
# mật khẩu mà Postgres/Mongo/RabbitMQ dựng lên bằng và mật khẩu mà app dùng để kết nối luôn là
# MỘT — không có đường lệch. Để Bitnami tự sinh password ngẫu nhiên thì app auth fail 100% và
# triệu chứng chỉ là CrashLoopBackOff, không nói gì về nguyên nhân.
#
# 🔑 Vì sao ở đây dùng `data:` tường minh chứ không `dataFrom.find` như app-secrets:
#    tên key do CHART BITNAMI quy định (postgres-password, mongodb-root-password, …), khác hẳn
#    tên param ở SSM (POSTGRES_PASSWORD, …). Phải map 1-1, không hút cả cây được.
#    Lợi thêm: ns data-<env> chỉ nhận đúng 4 giá trị nó cần, không thấy JWT_SECRET/Cloudinary.
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $es.targetName }}
  labels:
    app.kubernetes.io/name: infra
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Wave -1: Secret phải tồn tại TRƯỚC khi StatefulSet của 5 datastore được tạo (wave 0).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ $es.targetName }}
    creationPolicy: Owner
  data:
    # ---- PostgreSQL ----
    # Khớp postgresql.auth.secretKeys.adminPasswordKey ở infra/values.yaml.
    # Superuser `postgres` vì ddl-auto=update cần quyền tạo schema và app chỉ có một cặp
    # POSTGRES_USERNAME/PASSWORD dùng chung cho cả 5 DB.
    - secretKey: postgres-password
      remoteRef:
        key: {{ printf "%sPOSTGRES_PASSWORD" $path }}

    # ---- MongoDB ----
    # 🔴 Param /badminton/<env>/MONGODB_ROOT_PASSWORD là param MỚI của Day 6, phải nạp tay
    #    (docs/MANUAL-SETUP.md §3). Trước đó eks-secret.sh tách password ra khỏi
    #    MONGODB_CHAT_URI bằng sed — ESO không chạy được script, và con regex đó đã cắn một lần
    #    ở Day 4 (phải neo vào dấu "@" CUỐI CÙNG vì password base64 có thể chứa "@").
    #
    # ⚠️ BẤT BIẾN KHÔNG AI TỰ KIỂM ĐƯỢC: giá trị param này phải TRÙNG password đã nhúng trong
    #    MONGODB_CHAT_URI của cùng env. Lệch nhau → Mongo dựng bằng mật khẩu A, chat-service
    #    kết nối bằng mật khẩu B → auth fail NGAY LÚC BOOT, log chỉ nói "Authentication failed"
    #    và bạn sẽ đi soi ?authSource=admin (vốn đang đúng).
    - secretKey: mongodb-root-password
      remoteRef:
        key: {{ printf "%sMONGODB_ROOT_PASSWORD" $path }}

    # ---- RabbitMQ ----
    - secretKey: rabbitmq-password
      remoteRef:
        key: {{ printf "%sRABBITMQ_PASS" $path }}

    # 🔴 Param MỚI của Day 6. eks-secret.sh sinh cookie bằng `openssl rand -hex 16` rồi GIỮ LẠI
    # cái cũ nếu Secret đã tồn tại — RabbitMQ ghi cookie vào PVC lúc khởi tạo, cookie đổi trong
    # khi PVC còn data cũ thì node không nhận ra chính mình và boot fail bằng lỗi Erlang khó đọc.
    # ESO không sinh ngẫu nhiên được, và cũng KHÔNG NÊN: giá trị cố định ở SSM là thứ duy nhất
    # bảo đảm cookie không đổi giữa 2 lần refresh (mặc định 1h) trên một cụm đang sống.
    - secretKey: rabbitmq-erlang-cookie
      remoteRef:
        key: {{ printf "%sRABBITMQ_ERLANG_COOKIE" $path }}
{{- end }}
