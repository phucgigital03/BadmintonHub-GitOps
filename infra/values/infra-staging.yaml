# staging = namespace data-staging trên EKS (node amd64) → dùng chart Bitnami cho CẢ 5 datastore,
# kể cả MongoDB (chỉ kind arm64 mới phải đảo sang image chính chủ).
#
# ⚠️ PVC ở đây tạo EBS volume THẬT và tính tiền kể cả khi pod đã tắt. Runbook teardown §7.1
# bắt buộc `kubectl delete pvc --all -n data-staging` KHI CỤM CÒN SỐNG — reclaim policy Delete
# chỉ chạy lúc PVC bị xoá, destroy thẳng cụm thì không ai gọi nó và volume mồ côi vẫn chảy tiền.

# 🔴 Day 4 — GHIM StorageClass, đừng dựa vào default của cụm.
# EKS có sẵn `gp2` và Day 3 tạo thêm `gp3`. PVC không khai storageClassName sẽ lấy cái nào
# được đánh dấu default — mà cái đó tuỳ cách cài add-on, không phải hằng số. Hậu quả khi trật:
# volume ra gp2 (đắt hơn, IOPS thấp hơn) trong khi bạn tin là gp3, và không có lỗi nào cả.
# Verify sau khi cài: kubectl -n data-staging get pvc -o custom-columns=NAME:.metadata.name,SC:.spec.storageClassName
global:
  defaultStorageClass: gp3

# --------------------------------------------- External Secrets (Day 6)
# Bật → chart sinh ExternalSecret `datastore-secrets` trong ns data-staging (sync-wave -1, tức
# TRƯỚC 5 StatefulSet ở wave 0). Chính là Secret mà postgresql/mongodb/rabbitmq bên dưới trỏ
# `existingSecret` vào, nên mật khẩu datastore dựng lên bằng = mật khẩu app kết nối bằng.
# Thay thế `scripts/eks-secret.sh staging`.
externalSecret:
  enabled: true
  # 🔴 GIỮ dấu "/" cuối.
  ssmPath: /badminton/staging/

mongodb:
  enabled: true
mongodbOss:
  enabled: false

postgresql:
  primary:
    persistence:
      size: 8Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi

redis:
  master:
    persistence:
      size: 4Gi
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 512Mi

kafka:
  controller:
    persistence:
      size: 8Gi
    resources:
      requests:
        memory: 768Mi
        cpu: 200m
      limits:
        memory: 1536Mi

rabbitmq:
  persistence:
    size: 4Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 768Mi
