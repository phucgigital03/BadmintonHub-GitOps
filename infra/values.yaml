# Default chung cho cả 3 env. Mỗi env chỉ override kích thước + toggle ở infra/values/infra-<env>.yaml.
#
# Nguyên tắc: MỌI default của Bitnami đều đánh nhau với app này. Chưa override = mặc định hỏng,
# không phải mặc định chạy.
#
# 🔑 Mật khẩu KHÔNG nằm ở đây. Cả 3 chart có auth đều đọc từ Secret `datastore-secrets`
# trong namespace data-<env> (dev: scripts/kind-secret.sh sinh từ .env local · staging/prod:
# ExternalSecret của Day 6 sinh từ SSM). Nhờ vậy password mà datastore boot lên bằng và
# password mà app dùng luôn là MỘT, không có đường lệch.

global:
  # ⚠️ BẮT BUỘC khi trỏ image sang bitnamilegacy. Từ 2025 chart Bitnami có bước verify image và
  # sẽ CHẶN render với "Original containers have been substituted for unrecognized ones"
  # nếu repository khác mặc định mà không bật cờ này.
  security:
    allowInsecureImages: true

# ------------------------------------------------ External Secrets (Day 6)
# Sinh Secret `datastore-secrets` từ SSM — chính là Secret mà 3 chart Bitnami ở dưới trỏ
# `existingSecret` vào. Giải thích đầy đủ ở templates/externalsecret.yaml.
externalSecret:
  # Tắt ở dev: kind không có IRSA. Trên kind, scripts/kind-secret.sh sinh Secret cùng tên.
  enabled: false

  # 🔴 v1, KHÔNG phải v1beta1 — v1beta1 đã bị gỡ ở ESO 0.17.0, và ở 0.16.x thì webhook tự chuyển
  # đổi làm ArgoCD OutOfSync vĩnh viễn. Giải thích dài ở charts/platform/values.yaml.
  apiVersion: external-secrets.io/v1

  storeName: aws-ssm

  # Phải khớp `existingSecret` / `existingPasswordSecret` / `existingErlangSecret` bên dưới.
  targetName: datastore-secrets

  refreshInterval: 1h

  # Cây param SSM của env. BẮT BUỘC có dấu "/" cuối.
  ssmPath: ""

# ---------------------------------------------------------------- PostgreSQL
# MỘT instance / 5 database. Dùng superuser `postgres` vì ddl-auto=update cần quyền tạo schema
# và app chỉ có duy nhất một cặp POSTGRES_USERNAME/POSTGRES_PASSWORD dùng chung cho cả 5 DB.
postgresql:
  enabled: true
  # Không có dòng này tên Service thành "infra-postgresql" → mọi DB_*_URL trong app-config sai.
  fullnameOverride: postgresql
  image:
    repository: bitnamilegacy/postgresql
  architecture: standalone
  auth:
    enablePostgresUser: true
    existingSecret: datastore-secrets
    secretKeys:
      adminPasswordKey: postgres-password
  primary:
    initdb:
      scripts:
        # 5 DB cho 5 service có JPA. chat-service dùng Mongo, không có ở đây.
        00-create-databases.sql: |
          CREATE DATABASE user_db;
          CREATE DATABASE court_db;
          CREATE DATABASE booking_db;
          CREATE DATABASE payment_db;
          CREATE DATABASE escrow_db;
    persistence:
      size: 4Gi

# --------------------------------------------------------------------- Redis
# 🔴 auth.enabled=false là bắt buộc: đã kiểm application.yml của api-gateway, user, court,
# booking, payment, chat — tất cả chỉ khai spring.data.redis.host + port, KHÔNG có field
# password. Bật auth = mọi lệnh trả NOAUTH; và vì gateway áp RequestRateLimiter cho MỌI route
# nên hỏng Redis không phải mất một tính năng mà là TOÀN BỘ request 500.
redis:
  enabled: true
  fullnameOverride: redis
  image:
    repository: bitnamilegacy/redis
  # standalone → Service tên redis-master (khớp REDIS_HOST trong app-config)
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      size: 2Gi

# --------------------------------------------------------------------- Kafka
kafka:
  enabled: true
  fullnameOverride: kafka
  image:
    repository: bitnamilegacy/kafka
  # ⚠️ Chart 32.x KHÔNG còn `sasl.enabled`. Tắt SASL = đặt protocol của cả 3 listener về
  # PLAINTEXT. Client chỉ có KAFKA_BOOTSTRAP_SERVERS, không có cấu hình SASL nào.
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
  controller:
    replicaCount: 1
    # ⚠️ Chart 32.x cũng KHÔNG còn `autoCreateTopicsEnable`. Cơ chế thay thế là
    # overrideConfiguration (key/value → server.properties).
    # Auto-create là BẮT BUỘC: code publish/consume ~17 topic theo tên ở runtime
    # (booking.slot.changed, payment.proof.submitted, payment.host.confirmed,
    # payment.refund.queued, escrow.host.reimbursed, …) và KHÔNG có bean NewTopic nào.
    # Thiếu → consumer treo / producer UNKNOWN_TOPIC_OR_PARTITION, IM LẶNG; triệu chứng duy
    # nhất là "đặt sân xong slot không cập nhật". docker-compose local có
    # KAFKA_AUTO_CREATE_TOPICS_ENABLE=true nên bẫy này không lộ ra lúc dev.
    overrideConfiguration:
      auto.create.topics.enable: "true"
      offsets.topic.replication.factor: "1"
      transaction.state.log.replication.factor: "1"
      transaction.state.log.min.isr: "1"
      default.replication.factor: "1"
      min.insync.replicas: "1"
    persistence:
      size: 4Gi

# ------------------------------------------------------------------- MongoDB
# ⚠️ Root user nằm ở db `admin`. URI trỏ /chat_db bằng creds root mà thiếu ?authSource=admin
# → auth fail ngay lúc boot chat-service. authSource được nhét trong MONGODB_CHAT_URI (Secret).
mongodb:
  enabled: true
  fullnameOverride: mongodb
  image:
    repository: bitnamilegacy/mongodb
  architecture: standalone
  auth:
    enabled: true
    rootUser: root
    existingSecret: datastore-secrets
  persistence:
    size: 2Gi

# 🔴 Thay thế MongoDB bằng image chính chủ `mongo` — CHỈ dùng trên kind arm64.
# Lý do: bitnamilegacy/mongodb chỉ publish amd64 (đã verify 8.0.13, 8.0.4, 7.0.14, latest đều
# amd64-only), trong khi máy dev là Apple Silicon và node kind chạy arm64 → pod chết ngay với
# "exec format error" mà log không nói gì về kiến trúc.
# EKS là amd64 nên staging/prod vẫn dùng chart Bitnami — bật mongodb, tắt cái này.
# Cả hai đường đều cho ra Service tên `mongodb` cổng 27017 với root user ở db `admin`,
# nên MONGODB_CHAT_URI (kể cả ?authSource=admin) giống hệt nhau ở mọi env.
mongodbOss:
  enabled: false
  image: mongo:8.0
  rootUser: root
  existingSecret: datastore-secrets
  secretKey: mongodb-root-password
  storage: 2Gi
  resources:
    requests:
      memory: 192Mi
      cpu: 50m
    limits:
      memory: 512Mi

# ------------------------------------------------------------------ RabbitMQ
# ⚠️ STOMP relay là 5 chỗ riêng, không phải 1. Thiếu bất kỳ cái nào → chat-service kết nối
# relay thất bại: bật plugin · mở port trên POD · mở port trên SERVICE · đúng username ·
# VÀ mở 61613 trong NetworkPolicy (xem ngay dưới).
rabbitmq:
  enabled: true
  fullnameOverride: rabbitmq
  image:
    repository: bitnamilegacy/rabbitmq
  auth:
    # khớp default RABBITMQ_USER=badminton trong chat-service/application.yml
    username: badminton
    existingPasswordSecret: datastore-secrets
    existingSecretPasswordKey: rabbitmq-password
    existingErlangSecret: datastore-secrets
    existingSecretErlangKey: rabbitmq-erlang-cookie
  # default của chart là "rabbitmq_auth_backend_ldap" — thay hẳn bằng stomp
  extraPlugins: "rabbitmq_stomp"
  extraContainerPorts:
    - name: stomp
      containerPort: 61613
      protocol: TCP
  service:
    extraPorts:
      - name: stomp
        port: 61613
        targetPort: 61613
        protocol: TCP
  # 🔴 Chart Bitnami TỰ TẠO NetworkPolicy (networkPolicy.enabled mặc định true) và chỉ liệt kê
  # các cổng nó biết: 4369, 5672, 5671, 25672, 15672. 61613 KHÔNG có trong đó → cổng mở trên
  # pod, Service có endpoint, `rabbitmq-diagnostics listeners` báo STOMP đang nghe, nhưng pod
  # khác gọi vào thì **timeout**. Đã đo: từ chat-service, rabbitmq:5672 MỞ còn rabbitmq:61613
  # KHÔNG — kể cả khi gọi thẳng pod IP; từ trong chính pod rabbitmq thì 61613 lại mở bình thường.
  # Triệu chứng đánh lừa: `ConnectTimeoutException` chứ không phải `connection refused` hay lỗi
  # auth, nên rất dễ đi tìm nhầm ở phía credentials.
  networkPolicy:
    extraIngress:
      - ports:
          - port: 61613
            protocol: TCP
  persistence:
    size: 2Gi
