# frontend — prod
# nginx phục vụ bundle Vite, proxy /api + /ws sang api-gateway.
# Không envFrom: không có actuator, không đọc env Eureka/DB. Probe = / chứ không phải /actuator/*. FE same-origin nên 1 image dùng cho mọi env.
#
# Tên file KHÔNG được đổi: values/<svc>-<env>.yaml là hợp đồng với CI (bump image.tag)
# và với ApplicationSet của Day 6. Đặt sai tên = CI vẫn xanh, commit vẫn vào repo,
# ArgoCD không đọc → không deploy gì và không báo lỗi ở đâu.

# nameOverride quyết định TÊN Service. Phải đúng chữ: EUREKA_URL, nginx proxy của FE
# và Ingress backend đều gọi theo tên này.
nameOverride: frontend

image:
  repository: 547602846935.dkr.ecr.ap-southeast-1.amazonaws.com/frontend
  # tag = git SHA của repo app badmintonHub. Bất biến, KHÔNG bao giờ dùng `latest`:
  # tag cố định mới truy được cụm đang chạy code nào và rollback mới có nghĩa.
  #
  # 59bf4c6 = ĐÚNG image đã verify ở staging (Day 4), KHÔNG build lại cho prod.
  # Nội dung: patch WebSocketConfig + FE same-origin (5a7067c) + fallback uuid 3 tầng cho
  # crypto.randomUUID — API này chỉ có trên secure context, trên http thô nó undefined và
  # nút Gửi của chat im lặng không làm gì. Đã test thật trên ALB: chat gửi/nhận 2 chiều.
  #
  # Vì sao KHÔNG build image riêng cho prod: build lại từ cùng source vẫn ra image KHÁC
  # (base image đã cập nhật, dependency resolve khác) ⇒ prod chạy thứ chưa ai test, còn thứ
  # đã test thì nằm lại staging. Build MỘT lần, cùng tag đó đi staging → prod.
  # Day 5: CI tự bump values/<svc>-staging.yaml khi merge main. Promote prod = PR đổi dòng này.
  tag: 59bf4c6
  pullPolicy: IfNotPresent

strategy: RollingUpdate

port: 80
livenessPath: /
readinessPath: /
startupFailureThreshold: 6

# Day 4 — khai tường minh dù trùng mặc định của ALB ("/", 200), xem lý do ở
# values/frontend-staging.yaml.
service:
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200"

envFrom:
  configMap: ""
  secret: ""

resources:
  requests:
    memory: 32Mi
    cpu: 10m
  limits:
    memory: 64Mi
