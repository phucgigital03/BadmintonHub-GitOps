# frontend — staging
# nginx phục vụ bundle Vite, proxy /api + /ws sang api-gateway.
# Không envFrom: không có actuator, không đọc env Eureka/DB. Probe = / chứ không phải /actuator/*. FE same-origin nên 1 image dùng cho mọi env.
#
# Tên file KHÔNG được đổi: values/<svc>-<env>.yaml là hợp đồng với CI (bump image.tag)
# và với ApplicationSet của Day 6. Đặt sai tên = CI vẫn xanh, commit vẫn vào repo,
# ArgoCD không đọc → không deploy gì và không báo lỗi ở đâu.

# nameOverride quyết định TÊN Service. Phải đúng chữ: EUREKA_URL, nginx proxy của FE
# và Ingress backend đều gọi theo tên này.
nameOverride: frontend

image:
  repository: 547602846935.dkr.ecr.ap-southeast-1.amazonaws.com/frontend
  # tag = git SHA của repo app badmintonHub — commit chứa patch WebSocketConfig
  # (setAllowedOriginPatterns) + FE same-origin + lib/uuid.ts (crypto.randomUUID bị gate
  # [SecureContext] nên undefined trên http ⇒ chat gửi im lặng không lên). Bất biến,
  # KHÔNG bao giờ dùng `latest`: tag cố định mới truy được cụm đang chạy code nào và
  # rollback mới có nghĩa.
  # Day 5: CI tự bump dòng này khi merge main. Promote prod = PR đổi sang SHA đã verify ở staging.
  tag: e496991
  pullPolicy: IfNotPresent

strategy: RollingUpdate

port: 80
livenessPath: /
readinessPath: /
startupFailureThreshold: 6

# Day 4 — khai tường minh dù trùng mặc định của ALB ("/", 200). Lý do: mặc định là thứ có thể
# đổi theo version controller, mà triệu chứng khi nó đổi là "trang trắng 502" giữa buổi demo.
# 1 dòng values rẻ hơn nhiều so với 20 phút debug target group lúc đang có khán giả.
service:
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200"

envFrom:
  configMap: ""
  secret: ""

resources:
  requests:
    memory: 32Mi
    cpu: 10m
  limits:
    memory: 64Mi
