# payment-service — dev
# Postgres payment_db + Redis + Kafka + Cloudinary (ảnh proof).
# Với SPRING_PROFILES_ACTIVE=prod thì thiếu CLOUDINARY_* là fail boot (CloudinaryProdGuard) — by design.
#
# Tên file KHÔNG được đổi: values/<svc>-<env>.yaml là hợp đồng với CI (bump image.tag)
# và với ApplicationSet của Day 6. Đặt sai tên = CI vẫn xanh, commit vẫn vào repo,
# ArgoCD không đọc → không deploy gì và không báo lỗi ở đâu.

# nameOverride quyết định TÊN Service. Phải đúng chữ: EUREKA_URL, nginx proxy của FE
# và Ingress backend đều gọi theo tên này.
nameOverride: payment-service

image:
  repository: badmintonhub/payment-service
  # image nạp vào node bằng `kind load docker-image`, không có trên registry nào
  tag: dev
  pullPolicy: IfNotPresent

# Recreate ở dev: RollingUpdate với 1 replica bắt pod cũ sống tới khi pod mới Ready
# → 2 JVM cùng chạy đúng lúc pod mới cần CPU nhất. Máy kind không gánh nổi.
strategy: Recreate

port: 3006
livenessPath: /actuator/info
readinessPath: /actuator/health
startupFailureThreshold: 180

envFrom:
  configMap: app-config
  secret: app-secrets

# Image bake -XX:MaxRAMPercentage=75. Ở limit 640Mi thì heap chiếm 75% và chỉ còn
# 25% cho metaspace + thread stack + code cache + direct buffer — Spring Boot cần
# ~150-200Mi phần đó. Đã đo: 75% ở 448Mi => OOMKilled. Hạ tỉ lệ thay vì nâng limit,
# vì nâng limit thì 8 JVM không còn vừa RAM node.
env:
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=55 -XX:+UseContainerSupport"

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 640Mi
