# api-gateway — prod
# Redis (RequestRateLimiter áp cho MỌI route) + JWT_SECRET + FRONTEND_URL (globalcors) + EUREKA_URL.
# Redis hỏng ở đây = toàn bộ request 500, không phải mất một tính năng.
#
# Tên file KHÔNG được đổi: values/<svc>-<env>.yaml là hợp đồng với CI (bump image.tag)
# và với ApplicationSet của Day 6. Đặt sai tên = CI vẫn xanh, commit vẫn vào repo,
# ArgoCD không đọc → không deploy gì và không báo lỗi ở đâu.

# nameOverride quyết định TÊN Service. Phải đúng chữ: EUREKA_URL, nginx proxy của FE
# và Ingress backend đều gọi theo tên này.
nameOverride: api-gateway

image:
  repository: 547602846935.dkr.ecr.ap-southeast-1.amazonaws.com/api-gateway
  # tag = git SHA của repo app badmintonHub — commit chứa patch WebSocketConfig
  # (setAllowedOriginPatterns) + FE same-origin. Bất biến, KHÔNG bao giờ dùng `latest`:
  # tag cố định mới truy được cụm đang chạy code nào và rollback mới có nghĩa.
  # Day 5: CI tự bump dòng này khi merge main. Promote prod = PR đổi sang SHA đã verify ở staging.
  tag: 5a7067c
  pullPolicy: IfNotPresent

strategy: RollingUpdate

port: 3000
livenessPath: /actuator/info
readinessPath: /actuator/health
startupFailureThreshold: 60

# 🔴 Day 4 — ALB tự probe target group. Mặc định probe "/", mà Spring Cloud Gateway trả 404
# ở "/" → mọi target unhealthy → `/api` trả 502 dù pod xanh. Dùng /actuator/info (không chạm
# datastore) vì readiness của K8s đã gác composite /actuator/health rồi — xem giải thích đầy
# đủ ở values/api-gateway-staging.yaml.
# ⚠️ Ingress của ns prod đang enabled: false tới Day 8 (xem infra/values/platform-prod.yaml),
# nhưng annotation cứ để sẵn: hôm bật host là đúng ngay, không phải nhớ thêm một việc.
service:
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/info
    alb.ingress.kubernetes.io/success-codes: "200"

envFrom:
  configMap: app-config
  secret: app-secrets

# Image bake -XX:MaxRAMPercentage=75. Ở limit 768Mi thì heap chiếm 75% và chỉ còn
# 25% cho metaspace + thread stack + code cache + direct buffer — Spring Boot cần
# ~150-200Mi phần đó. Đã đo: 75% ở 448Mi => OOMKilled. Hạ tỉ lệ thay vì nâng limit,
# vì nâng limit thì 8 JVM không còn vừa RAM node.
env:
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseContainerSupport"

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 768Mi
