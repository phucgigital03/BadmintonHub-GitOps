# App-of-apps — ĐÂY LÀ FILE DUY NHẤT PHẢI `kubectl apply` BẰNG TAY.
#
# Sau lệnh đó, ArgoCD tự đọc cả thư mục apps/ và dựng mọi thứ còn lại: 2 app infra, 2 app
# platform, 1 ApplicationSet sinh ra 18 app service. Không còn `helm install` nào bằng tay.
#
#   kubectl apply --server-side -f apps/root.yaml
#
# 🔴 `--server-side` KHÔNG phải tuỳ chọn cho đẹp — đo thật ở Day 6.
#    `kubectl apply` thường (client-side) nhét annotation `kubectl.kubernetes.io/last-applied-configuration`
#    vào object. Annotation đó không có trong Git, mà root TỰ QUẢN LÝ CHÍNH NÓ ⇒ ArgoCD so
#    desired (Git) với live (có annotation) thấy khác nhau ⇒ `badmintonhub-root` đứng
#    **OutOfSync vĩnh viễn** trong khi cả 22 app con đều Synced/Healthy.
#    Không hỏng gì về vận hành, nhưng làm hỏng thứ đắt hơn: tín hiệu. Từ đó trở đi "có app
#    OutOfSync" không còn nghĩa là "có gì đó sai" nữa.
#    Server-side apply ghi field ownership vào metadata.managedFields thay vì annotation → hết lệch.
#
# 🔴 Root quản lý CHÍNH THƯ MỤC CHỨA NÓ, nên nó tự quản lý luôn bản thân. Sửa file này rồi push
#    thì ArgoCD tự áp dụng — trừ lần đầu tiên.
#
# 🔴 Muốn hạ cả cụm thì xoá ROOT, không xoá con:
#      argocd app delete badmintonhub-root --cascade
#    Xoá child app là vô nghĩa — ApplicationSet controller sinh lại ngay lập tức.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: badmintonhub-root
  namespace: argocd
  finalizers:
    # Không có finalizer này thì `--cascade` xoá Application nhưng BỎ LẠI object thật trên cụm:
    # Ingress còn sống → ALB không bị AWS LB Controller gỡ → tiền vẫn chảy sau khi teardown.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/phucgigital03/BadmintonHub-GitOps
    targetRevision: main
    # Chỉ đọc *.yaml ở tầng ngay trong apps/. KHÔNG recurse — thư mục con (nếu sau này có)
    # phải được khai tường minh bằng một Application riêng.
    path: apps
    #
    # 🔴 KHÔNG khai `directory: { recurse: false }` — đo thật ở Day 6.
    # `false` đúng bằng giá trị mặc định, mà API server áp omitempty cho boolean false nên field
    # bị LOẠI BỎ khỏi object đã lưu. ArgoCD so Git (có field) với live (không có field) ⇒
    # badmintonhub-root đứng **OutOfSync VĨNH VIỄN** trong khi 22 app con đều Synced/Healthy.
    # Bấm sync bao nhiêu lần cũng không hết vì lần nào ghi xuống cũng bị lược đi.
    # Không hỏng vận hành, nhưng giết mất TÍN HIỆU: từ đó "có app OutOfSync" không còn nghĩa
    # là "có gì đó sai".
    #
    # Quy tắc rút ra: đừng khai tường minh field bằng ĐÚNG giá trị mặc định (false / 0 / "")
    # trong manifest mà chính ArgoCD quản lý. Muốn ghi lại chủ ý thì viết comment như trên.

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      # prune: xoá file khỏi apps/ = xoá app khỏi cụm.
      prune: true
      # selfHeal: `kubectl edit` tay bị kéo về đúng Git. Đây là rule 4 của gitops-workflow.md,
      # không phải phiền toái — nó là thứ bảo đảm "cụm luôn khớp main".
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
