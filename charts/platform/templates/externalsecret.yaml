{{- if .Values.externalSecret.enabled }}
{{- $es := .Values.externalSecret -}}
# ExternalSecret → Secret `app-secrets` trong namespace <env>.
#
# Đây là cái THAY THẾ scripts/eks-secret.sh của Day 4. Giá trị thật nằm ở SSM Parameter Store
# (/badminton/<env>/*), sống NGOÀI cụm → `terraform destroy` không xoá → rebuild là pod có
# secret ngay, KHÔNG ai phải chạy script nào. Đó chính là tiêu chí vàng "0 thao tác tay".
#
# 🔑 Tên target giữ nguyên `app-secrets` — đúng cái mà `envFrom.secret` của 27 file values đang
#    trỏ tới. Nhờ vậy chuyển từ script sang ESO KHÔNG phải sửa một dòng values nào.
#
# 🔴 Trong file này KHÔNG có một giá trị secret nào, chỉ có TÊN param. Repo public vẫn an toàn.
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $es.targetName }}
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Secret phải có TRƯỚC pod. Wave -1 chạy trước wave 0 (ConfigMap/Ingress) và trước 18 app
    # service do ApplicationSet sinh ra. Thiếu nó thì pod start lúc Secret chưa tồn tại →
    # CreateContainerConfigError; nó tự khỏi sau khi ESO sync xong, nhưng giữa buổi demo thì
    # trông hệt như cụm hỏng.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    # ClusterSecretStore (cluster-scoped) do bootstrap.sh của Day 3 cài, KHÔNG phải SecretStore
    # (namespaced) — một store dùng chung cho cả staging, prod, data-staging, data-prod.
    name: {{ $es.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ $es.targetName }}
    # Owner: ESO tạo và sở hữu Secret, xoá ExternalSecret là Secret biến mất theo.
    creationPolicy: Owner
    {{- if $es.optionalKeys }}
    template:
      engineVersion: v2
      # 🔴 mergePolicy: Merge — data lấy từ `dataFrom` bên dưới có ưu tiên THẤP HƠN block
      #    `data` ở đây. Docs ESO: "data and dataFrom keys will also be embedded into the
      #    templated secret, having lower priority than the template outcome."
      #
      # Vì sao cần block này: SSM TỪ CHỐI giá trị rỗng (ValidationException: length ≥ 1) nên 3
      # param optional dưới đây không được tạo ở SSM → `dataFrom.find` chỉ sinh 10 key. Nhưng
      # Spring cần key TỒN TẠI (kể cả rỗng) để resolve ${SENDGRID_API_KEY}; thiếu hẳn key thì
      # context fail với "Could not resolve placeholder", và lỗi đó không nhắc gì tới Secret.
      # Day 4 boot được là nhờ eks-secret.sh dùng ${VAR:-} sinh ra key rỗng — block này tái lập
      # đúng hình dạng Secret đã verify chạy được đó.
      #
      # ⚠️ KHÔNG viết `{{`{{ .SENDGRID_API_KEY | default "" }}`}}` — docs ESO nói rõ "referencing a
      #    non-existing key in the template will raise an error, instead of being suppressed".
      #    Phải là giá trị literal.
      #
      # 🔴 LANDMINE — đọc trước khi nạp key thật:
      #    Ngày nào bạn `aws ssm put-parameter` giá trị THẬT cho SENDGRID_API_KEY (hoặc 2 key
      #    Google), PHẢI xoá tên đó khỏi `externalSecret.optionalKeys` ở values. Không xoá thì
      #    template thắng provider → giá trị thật bị ghi đè thành rỗng TRONG IM LẶNG:
      #    ExternalSecret vẫn SecretSynced, key vẫn tồn tại, chỉ là email không bao giờ gửi.
      mergePolicy: Merge
      data:
        {{- range $es.optionalKeys }}
        {{ . }}: ""
        {{- end }}
    {{- end }}
  dataFrom:
    - find:
        # Hút cả cây param của env này thành một Secret. Thêm param mới ở SSM là tự có, không
        # phải sửa file này — trừ khi nó cần đi vào datastore-secrets (xem infra/templates/).
        path: {{ required "externalSecret.ssmPath là bắt buộc khi externalSecret.enabled" $es.ssmPath | quote }}
        # 🔴 `name.regexp` là BẮT BUỘC, không phải bộ lọc tuỳ chọn — đã đo thật trên EKS.
        # Provider AWS Parameter Store của ESO chọn cách tìm theo TOÁN TỬ:
        #     find.name có   → tìm theo regexp tên
        #     find.tags có   → tìm theo tag
        #     không cái nào  → error "unexpected find operator"
        # `path` chỉ là bộ LỌC PHẠM VI, tự nó không phải toán tử. Viết `find.path` trần thì
        # ExternalSecret đứng ở SecretSyncedError vĩnh viễn, và message KHÔNG nhắc gì tới
        # việc thiếu `name` — nó chỉ nói "unexpected find operator".
        # `.*` = lấy mọi tên trong path đó, đúng ý "hút cả cây".
        name:
          regexp: ".*"
      # 🔴 rewrite KHÔNG phải tuỳ chọn làm đẹp — thiếu nó là hỏng thẳng.
      # ESO trả key kèm NGUYÊN đường dẫn: "/badminton/staging/JWT_SECRET". Mà key của một
      # Kubernetes Secret bắt buộc khớp [-._a-zA-Z0-9]+ — dấu "/" không hợp lệ → ExternalSecret
      # không sync được và mọi pod đứng ở CreateContainerConfigError.
      # Regex này cắt lấy đoạn sau dấu "/" cuối cùng → JWT_SECRET.
      # An toàn hai chiều: nếu bản ESO nào đó đã tự cắt sẵn prefix thì chuỗi không khớp regex và
      # ReplaceAllString trả về nguyên vẹn — không có đường hỏng.
      rewrite:
        - regexp:
            source: "^.*/([^/]+)$"
            target: "${1}"
{{- end }}
