{{- $pg := printf "%s.%s.svc.cluster.local" .Values.datastore.postgresHost .Values.dataNamespace -}}
{{- $jdbc := printf "jdbc:postgresql://%s:5432" $pg -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMapName }}
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  # ---- PostgreSQL: MỘT instance / 5 database (compose local chạy 5 PG riêng) ----
  # Mỗi service trỏ full-URL riêng nên gộp instance mà vẫn 0 đổi code.
  # chat-service KHÔNG có Postgres (đã exclude DataSourceAutoConfiguration), escrow KHÔNG có Redis.
  DB_USER_URL: {{ printf "%s/user_db" $jdbc | quote }}
  DB_COURT_URL: {{ printf "%s/court_db" $jdbc | quote }}
  DB_BOOKING_URL: {{ printf "%s/booking_db" $jdbc | quote }}
  DB_PAYMENT_URL: {{ printf "%s/payment_db" $jdbc | quote }}
  DB_ESCROW_URL: {{ printf "%s/escrow_db" $jdbc | quote }}

  # ---- Redis ----
  # auth.enabled=false ở chart Bitnami: app chỉ khai spring.data.redis.host/port, KHÔNG có field
  # password. Bật auth = mọi lệnh trả NOAUTH, và gateway áp RequestRateLimiter cho MỌI route
  # nên hỏng Redis = TOÀN BỘ request 500, không phải mất một tính năng.
  REDIS_HOST: {{ printf "%s.%s.svc.cluster.local" .Values.datastore.redisHost .Values.dataNamespace | quote }}
  REDIS_PORT: "6379"

  # ---- Kafka ----
  # ⚠️ user-service CŨNG khai spring.kafka.bootstrap-servers (application.yml:21-22) — bảng env
  # trong doc từng ghi "—" cho user-service, sai. Thiếu biến này nó trỏ localhost:9092.
  KAFKA_BOOTSTRAP_SERVERS: {{ printf "%s.%s.svc.cluster.local:9092" .Values.datastore.kafkaHost .Values.dataNamespace | quote }}

  # ---- RabbitMQ (STOMP relay cho chat) ----
  # RABBITMQ_PASS là secret → nằm ở Secret app-secrets, không ở đây.
  RABBITMQ_HOST: {{ printf "%s.%s.svc.cluster.local" .Values.datastore.rabbitmqHost .Values.dataNamespace | quote }}
  RABBITMQ_STOMP_PORT: "61613"
  RABBITMQ_USER: "badminton"
  CHAT_BROKER_RELAY: "true"

  # ---- Eureka ----
  # Giữ dấu "/" cuối đúng như default trong application.yml và docker-compose.app.yml.
  EUREKA_URL: {{ printf "http://eureka-server.%s.svc.cluster.local:8761/eureka/" .Values.appNamespace | quote }}

  # ---- URL công khai ----
  # Dùng ở 2 chỗ: link email verify/reset (user-service EmailServiceImpl) VÀ
  # WebSocketConfig.setAllowedOrigins() của chat-service (validate Origin của WS handshake).
  FRONTEND_URL: {{ .Values.frontendUrl | quote }}

  # ---- Hàng rào khởi động (Day 6) ----
  # Danh sách host:port mà initContainer của charts/service chờ mở cổng TRƯỚC KHI cho JVM chạy.
  #
  # 🔴 Vì sao cần: đo thật ở Day 6, ArgoCD tạo 18 pod service lúc 02:33:31 còn 10 pod datastore
  # mãi 02:36:03 — sớm hơn 2 phút rưỡi. Spring fail ngay lúc boot với
  # `UnknownHostException: postgresql.data-staging.svc.cluster.local` (DNS chưa có, không phải
  # connection refused), container exit, kubelet restart. 6/9 service mỗi env restart 1-3 lần.
  #
  # sync-wave của ArgoCD KHÔNG chặn được: một Application vừa tạo chưa quản lý resource nào,
  # mà app không có resource thì được chấm Healthy ⇒ cổng wave mở ngay trong ~3 giây.
  # Hàng rào phải nằm ở tầng kubelet (initContainer), không nằm ở tầng ArgoCD.
  #
  # Ghép chuỗi từ dataNamespace nên đổi env chỉ là đổi 1 dòng values, không phải sửa 18 file.
  DATASTORE_WAIT: >-
    {{ printf "%s.%s.svc.cluster.local:5432" .Values.datastore.postgresHost .Values.dataNamespace }}
    {{ printf "%s.%s.svc.cluster.local:6379" .Values.datastore.redisHost .Values.dataNamespace }}
    {{ printf "%s.%s.svc.cluster.local:9092" .Values.datastore.kafkaHost .Values.dataNamespace }}
    {{ printf "%s.%s.svc.cluster.local:27017" .Values.datastore.mongoHost .Values.dataNamespace }}
    {{ printf "%s.%s.svc.cluster.local:61613" .Values.datastore.rabbitmqHost .Values.dataNamespace }}

  # ---- Probe ----
  # Mở /actuator/health/liveness + /readiness. KHÔNG có biến này thì 2 endpoint trả 404
  # và pod không bao giờ Ready. 0 dòng code, 0 dòng pom.
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

  # ---- Metrics (Day 7) ----
  # Mở /actuator/prometheus cho kube-prometheus-stack scrape. Cùng cách đã dùng cho biến probe
  # ngay trên: application.yml của 8 service ship `health,info`, biến env này đè lên — 0 dòng
  # code, 0 dòng pom ở repo app.
  #
  # Hai nửa của cơ chế nằm ở HAI repo, thiếu nửa nào cũng hỏng và triệu chứng giống hệt nhau
  # (target DOWN), nên ghi rõ ở đây:
  #   repo app  — micrometer-registry-prometheus trên classpath (endpoint mới TỒN TẠI)
  #             + "/actuator/prometheus" trong permitAll của 6 SecurityConfig. Các matcher đó là
  #               path LITERAL, không phải prefix, nên trước Day 7 endpoint này trả 403.
  #   repo này  — dòng dưới (endpoint được PHƠI ra).
  #
  # An toàn với image CŨ: `values/*-prod.yaml` còn ở tag trước Day 7, image đó không có
  # micrometer nên Spring đơn giản là không có endpoint để phơi — health/info không đổi hành vi.
  # Biến thừa, không phải biến hỏng.
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"

  # ---- Graceful shutdown (Day 7) ----
  # Nửa Kubernetes đã có từ Day 6 trong charts/service: preStop `sleep 15` +
  # terminationGracePeriodSeconds 45. Nửa Spring là 2 dòng dưới đây — thiếu nó thì SIGTERM giết
  # JVM ngay lập tức và request đang dở bị cắt giữa chừng thành 502 ở ALB.
  #
  # Ngân sách 45s chia ra: 15 (preStop — pod đã bị rút khỏi Endpoints, chờ kube-proxy/ALB và
  # Eureka hội tụ) + 20 (drain request đang dở) + 10 dư. Đổi số nào cũng phải soát lại
  # terminationGracePeriodSeconds ở charts/service/templates/deployment.yaml: nếu tổng vượt 45
  # thì kubelet gửi SIGKILL trước khi Spring drain xong, tức mất đúng thứ vừa bật.
  SERVER_SHUTDOWN: "graceful"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "20s"

  # ---- Knob nghiệp vụ ----
  # PAYMENT_EXPIRE_MINUTES bị ép bằng đúng BOOKING_HOLD_MINUTES: hai service comment rõ là
  # hold window và payment window phải hết hạn cùng lúc.
  BOOKING_HOLD_MINUTES: {{ .Values.booking.holdMinutes | quote }}
  BOOKING_MAX_HOLD_MINUTES: {{ .Values.booking.maxHoldMinutes | quote }}
  PAYMENT_EXPIRE_MINUTES: {{ .Values.booking.holdMinutes | quote }}

  # ---- JWT (chỉ TTL; JWT_SECRET là secret) ----
  JWT_ACCESS_EXPIRATION_MS: {{ .Values.jwt.accessExpirationMs | quote }}
  JWT_REFRESH_EXPIRATION_MS: {{ .Values.jwt.refreshExpirationMs | quote }}

  # ---- SendGrid (chỉ phần non-secret; SENDGRID_API_KEY là secret) ----
  SENDGRID_FROM_EMAIL: {{ .Values.sendgrid.fromEmail | quote }}
  SENDGRID_FROM_NAME: {{ .Values.sendgrid.fromName | quote }}

  {{- if .Values.springProfilesActive }}
  SPRING_PROFILES_ACTIVE: {{ .Values.springProfilesActive | quote }}
  {{- end }}
  {{- range $k, $v := .Values.extraConfig }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
