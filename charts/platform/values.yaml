# Default cho charts/platform. Mỗi env override ở infra/values/platform-<env>.yaml.
#
# ConfigMap app-config chứa TOÀN BỘ biến non-secret của mọi service (kể cả 5 biến DB_*_URL).
# Service nào chỉ đọc biến của nó — dư biến vô hại — đổi lại values/<svc>-<env>.yaml gần như
# không có block env riêng, nên 27 file values rất mỏng và ít chỗ sai.

configMapName: app-config

# ⚠️ Sửa ConfigMap KHÔNG làm pod restart — `envFrom` chỉ đọc lúc container khởi động.
# ArgoCD sync xong sẽ báo Synced/Healthy trong khi pod vẫn chạy giá trị CŨ.
# Đường rebuild bình thường (destroy → apply → bootstrap) không dính, vì pod sinh ra SAU ConfigMap.
# Chỉ dính khi sửa app-config trên cụm ĐANG SỐNG — đúng 2 lúc: Day 4 (điền ALB DNS vào
# FRONTEND_URL) và Day 8 (đổi sang domain). Sau khi sync, phải:
#     kubectl -n <env> rollout restart deploy
# Nhớ kỹ vì triệu chứng là chat chết mà mọi thứ khác xanh, và ArgoCD không hề báo gì.

# Namespace app và namespace datastore. Chart tự ghép chuỗi DNS in-cluster từ 2 giá trị này
# → đổi env chỉ là đổi 2 dòng, không phải sửa 20 chuỗi FQDN bằng tay.
appNamespace: dev
dataNamespace: data-dev

# Tên Service của các chart Bitnami. Khớp fullnameOverride khai ở infra/values/infra-<env>.yaml.
# Redis architecture=standalone → Service tên <fullnameOverride>-master.
datastore:
  postgresHost: postgresql
  redisHost: redis-master
  kafkaHost: kafka
  mongoHost: mongodb
  rabbitmqHost: rabbitmq

# URL công khai của env.
# ⚠️ KHÔNG chỉ dùng cho link email verify/reset của user-service: chat-service nạp nó vào
# app.frontend-url và WebSocketConfig.setAllowedOrigins() dùng để validate Origin header của
# WS handshake → sai giá trị = chat chết, các luồng khác vẫn xanh.
frontendUrl: http://localhost:8081

# "" ở dev (Cloudinary degrade về placeholder URL, không cần API key thật trên kind).
# "prod" ở staging/prod → CloudinaryProdGuard @Profile("prod") sẽ CHẶN BOOT payment/chat
# nếu thiếu CLOUDINARY_* — đây là by design, nạp param chứ đừng bỏ profile.
springProfilesActive: ""

booking:
  # Invariant: PAYMENT_EXPIRE_MINUTES được template ép bằng đúng holdMinutes.
  # Hai giá trị lệch nhau = booking hết hạn trước/sau payment, slot kẹt.
  holdMinutes: 10
  maxHoldMinutes: 30

jwt:
  # ⚠️ Để dạng CHUỖI. Số nguyên lớn bị Helm/YAML hiểu là float rồi render ra "2.592e+09",
  # Spring parse Long thất bại → user-service fail boot. Đã dính thật khi để không quote.
  accessExpirationMs: "900000"
  refreshExpirationMs: "2592000000"

sendgrid:
  fromEmail: noreply@badmintonhub.vn
  fromName: BadmintonHub

# Thoát hiểm: thêm/ghi đè key bất kỳ mà không phải sửa template.
extraConfig: {}

# ------------------------------------------------------------------ Ingress ALB (Day 4)
# Tắt ở dev: kind không có AWS Load Balancer Controller nên object Ingress chỉ nằm im,
# không ai xử lý — e2e trên kind đi bằng `kubectl port-forward` (xem scripts/kind-deploy.sh).
ingress:
  enabled: false

  # Tên object Ingress. Cùng group.name nhưng KHÁC namespace nên staging/prod không đụng nhau.
  name: badminton

  # IngressClass do chart aws-load-balancer-controller tạo (Day 3).
  # Dùng spec.ingressClassName thay annotation kubernetes.io/ingress.class (deprecated ở v2).
  # Verify trước khi cài: kubectl get ingressclass alb
  className: alb

  # 🔑 HAI CÔNG TẮC CỦA DAY 8 — mặc định rỗng, KHÔNG điền trước Day 8.
  #   host           "" → không render rules[].host → ALB nhận mọi Host header
  #                       → truy cập bằng DNS thô http://k8s-badminton-....elb.amazonaws.com
  #   certificateArn "" → chỉ listener 80, không ssl-redirect
  # Điền cả hai ở Day 8 → + host + listener 443 + redirect 80→443 + record Route53 tự tạo.
  # KHÔNG hardcode ARN vào Git: Terraform đọc cert bằng data source, còn ở đây là 1 dòng values.
  host: ""
  certificateArn: ""

  # staging + prod CHUNG một ALB. Đổi giá trị này = ALB mới = DNS mới.
  groupName: badminton

  # Mặc định ALB là 60s → đủ để ngắt WebSocket chat khi người xem ngồi im giữa demo.
  idleTimeoutSeconds: 300

  # Tên backend = tên Service thật (nameOverride của charts/service), KHÔNG phải release name.
  backends:
    api:
      name: api-gateway
      port: 3000
    web:
      name: frontend
      port: 80

  # Thoát hiểm: thêm annotation ALB bất kỳ mà không phải sửa template
  # (vd alb.ingress.kubernetes.io/wafv2-acl-arn, .../tags).
  extraAnnotations: {}

# ------------------------------------------------ External Secrets (Day 6)
# Sinh Secret `app-secrets` từ SSM, thay cho scripts/eks-secret.sh.
externalSecret:
  # Tắt ở dev: kind không có IRSA nên ESO không có đường đọc SSM. Trên kind, `app-secrets` do
  # scripts/kind-secret.sh sinh từ .env local — cùng TÊN Secret nên values của service không đổi.
  enabled: false

  # 🔴 KHÔNG để v1beta1.
  # `external-secrets.io/v1beta1` ĐÃ BỊ GỠ ở ESO v0.17.0 (v0.16.x phục vụ cả hai, v1 là bản chính
  # thức). Hai kiểu hỏng khác nhau:
  #   - ESO >= 0.17 + khai v1beta1 → manifest không apply được, app ArgoCD đỏ ngay (còn dễ thấy).
  #   - ESO 0.16.x + khai v1beta1 → webhook TỰ chuyển sang v1, ArgoCD so desired (v1beta1) với
  #     live (v1) thấy khác nhau → app OutOfSync VĨNH VIỄN, bấm sync bao nhiêu lần cũng không hết
  #     (external-secrets#5478). Cái này mới là cái tốn thời gian.
  # ESO < 0.16 thì đổi đúng 1 dòng này về external-secrets.io/v1beta1.
  # Kiểm: kubectl get crd externalsecrets.external-secrets.io -o jsonpath='{.spec.versions[*].name}'
  apiVersion: external-secrets.io/v1

  # ClusterSecretStore do bootstrap.sh của Day 3 cài (cluster-scoped, dùng chung 4 namespace).
  storeName: aws-ssm

  # Phải khớp `envFrom.secret` trong 27 file values/. Đổi tên này = phải sửa cả 27 file.
  targetName: app-secrets

  refreshInterval: 1h

  # Cây param SSM của env. BẮT BUỘC có dấu "/" cuối, nếu không `find` khớp nhầm sang env khác
  # (vd "/badminton/prod" cũng khớp "/badminton/production/...").
  ssmPath: ""

  # Key BẮT BUỘC tồn tại trong Secret nhưng KHÔNG có ở SSM, vì SSM từ chối giá trị rỗng
  # (ValidationException: length ≥ 1). Template bơm chúng vào với giá trị "" để Spring resolve
  # được placeholder ${...} — thiếu hẳn key thì context fail bằng "Could not resolve placeholder",
  # một thông báo không nhắc gì tới Secret.
  # 🔴 Nạp giá trị THẬT cho cái nào ở SSM thì phải XOÁ tên đó khỏi danh sách này, không thì bị
  #    ghi đè rỗng trong im lặng (template thắng provider) — xem landmine ở templates/.
  optionalKeys:
    - SENDGRID_API_KEY
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
