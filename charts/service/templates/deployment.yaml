apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
    {{- include "service.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy }}
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "service.labels" . | nindent 8 }}
        {{- include "service.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # Eureka lease-expiration-duration-in-seconds: 30 → bản ghi của pod đã chết còn sống 30s,
      # gateway vẫn route vào đó = 5xx trước mặt khán giả. preStop sleep để pod ngừng nhận traffic
      # mới nhưng vẫn phục vụ request đang dở trong lúc Eureka/Endpoints hội tụ.
      terminationGracePeriodSeconds: 45
      {{- if .Values.waitForDatastores }}
      # ─────────────────────────────── HÀNG RÀO KHỞI ĐỘNG (Day 6) ───────────────────────────────
      # Chặn JVM chạy cho tới khi mọi datastore đã MỞ CỔNG. Pod đứng ở Init, không boot, không
      # chết, không restart, không đốt CPU.
      #
      # 🔴 Vì sao KHÔNG dựa vào sync-wave của ArgoCD (đã đo thật ở Day 6):
      #    18 pod service sinh lúc 02:33:31, 10 pod datastore mãi 02:36:03 — sớm hơn 2'30".
      #    Spring chết với `UnknownHostException: postgresql.data-<env>.svc.cluster.local`
      #    (DNS chưa có, KHÔNG phải connection refused) → exit → kubelet restart.
      #    Nguyên nhân: ArgoCD mở cổng wave khi resource của wave trước Healthy, mà một
      #    Application vừa tạo chưa quản lý resource nào ⇒ "không có resource" = Healthy ⇒
      #    cổng mở trong ~3 giây. sync-wave là best-effort, KHÔNG phải hàng rào.
      #
      # ⚠️ Có TIMEOUT có chủ đích: hết ngân sách thì initContainer thoát 0 và để app tự thử.
      #    Không có timeout thì một cổng bị NetworkPolicy chặn (đã từng xảy ra với RabbitMQ
      #    61613 ở Day 2) sẽ làm pod kẹt Init VĨNH VIỄN — hỏng nặng hơn crashloop, vì crashloop
      #    ít ra còn tự khỏi và còn log để đọc.
      initContainers:
        - name: wait-datastores
          image: {{ .Values.waitImage }}
          # Lấy DATASTORE_WAIT từ ConfigMap app-config — chuỗi host:port do charts/platform ghép
          # từ dataNamespace, nên đổi env không phải sửa file values nào.
          envFrom:
            - configMapRef:
                name: {{ required "waitForDatastores cần envFrom.configMap" .Values.envFrom.configMap }}
          command: ["sh", "-c"]
          args:
            - |
              if [ -z "$DATASTORE_WAIT" ]; then
                echo "DATASTORE_WAIT rỗng — bỏ qua hàng rào"; exit 0
              fi
              deadline=$(( $(date +%s) + {{ .Values.waitTimeoutSeconds }} ))
              for hp in $DATASTORE_WAIT; do
                host=${hp%:*}; port=${hp##*:}
                printf 'chờ %s:%s ' "$host" "$port"
                while ! nc -z "$host" "$port" 2>/dev/null; do
                  if [ "$(date +%s)" -ge "$deadline" ]; then
                    echo "HẾT GIỜ sau {{ .Values.waitTimeoutSeconds }}s — bỏ hàng rào, để app tự thử"
                    exit 0
                  fi
                  printf '.'; sleep 2
                done
                echo " ok"
              done
              echo "tất cả datastore đã mở cổng"
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 32Mi
      {{- end }}
      containers:
        - name: {{ include "service.name" . }}
          image: "{{ required "image.repository bắt buộc" .Values.image.repository }}:{{ required "image.tag bắt buộc (git SHA, KHÔNG dùng latest)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          {{- if or .Values.envFrom.configMap .Values.envFrom.secret }}
          envFrom:
            {{- if .Values.envFrom.configMap }}
            - configMapRef:
                name: {{ .Values.envFrom.configMap }}
            {{- end }}
            {{- if .Values.envFrom.secret }}
            - secretRef:
                name: {{ .Values.envFrom.secret }}
            {{- end }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          # startup → liveness → readiness. liveness/readiness KHÔNG dùng /actuator/health
          # (composite gộp db+redis+mongo+Eureka: một nhịp Redis lỗi là K8s restart pod → cascade).
          # timeoutSeconds phải khai tường minh — mặc định 1s và probe timeout bị tính là fail.
          startupProbe:
            httpGet:
              path: {{ .Values.livenessPath }}
              port: http
            failureThreshold: {{ .Values.startupFailureThreshold }}
            periodSeconds: 5
            timeoutSeconds: {{ .Values.probeTimeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessPath }}
              port: http
            periodSeconds: 10
            failureThreshold: {{ .Values.livenessFailureThreshold }}
            timeoutSeconds: {{ .Values.probeTimeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessPath }}
              port: http
            periodSeconds: 10
            failureThreshold: {{ .Values.readinessFailureThreshold }}
            timeoutSeconds: {{ .Values.probeTimeoutSeconds }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
